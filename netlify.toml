# netlify.toml - Static Production Deployment Configuration for PDF Toolkit (PDFGO)
# 100% Client-Side, Zero Network Leaks, Zero Serverless Functions

[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

# Strict Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    # CSP hashes are generated into dist/_headers by build.mjs.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Cache HTML with validation
    Cache-Control = "public, max-age=0, must-revalidate"

# Single-Page Application Fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
